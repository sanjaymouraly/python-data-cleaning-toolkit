[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaning-toolkit"
version = "1.0.0"
description = "Advanced, safety-first CSV & Excel data cleaner: reusable Python engine + CLI + Streamlit dashboard, with profiling, audit trails and reproducible cleaning configs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
keywords = ["data-cleaning", "csv", "excel", "pandas", "data-quality", "etl", "streamlit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0,<3",
    "openpyxl>=3.1",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.49",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "streamlit>=1.49",
    "plotly>=5.20",
]

[project.scripts]
cleaner = "data_cleaning_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/sanjaymouraly/python-data-cleaning-toolkit"
Documentation = "https://github.com/sanjaymouraly/python-data-cleaning-toolkit/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_cleaning_toolkit.config" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: marks tests as slow (large datasets, performance)",
    "e2e: end-to-end tests including CLI subprocess runs",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]  # ternary != always more readable

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "SIM115", "E402", "F841"]
"scripts/*" = ["E501", "SIM115", "B007", "F841", "SIM222"]
